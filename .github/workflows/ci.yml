name: Validate package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Run complete validation
        run: python scripts/validate_all.py
      - name: Verify release manifest
        run: python scripts/verify_package.py
      - name: Build OCR-enabled container
        run: docker build -t examenreglement-checker:test .
